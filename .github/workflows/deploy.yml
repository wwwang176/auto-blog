name: Deploy to GitHub Pages
on:
  push:
    branches: [main]
  # 排程重建已暫停（2026-10-10，暫停發文）。要恢復時，把下面三行取消註解（cron 是 UTC，等於台北 09/12/15/19 點的 :02、:07、:13）：
  # schedule:
  #   - cron: '2,7,13 1,4,7,11 * * *'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: withastro/action@v6
        with:
          node-version: 22
        env:
          PUBLIC_GA_ID: ${{ vars.PUBLIC_GA_ID }}
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
