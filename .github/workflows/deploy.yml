name: Deploy to GitHub Pages
on:
  push:
    branches: [main]
  schedule:
    # 台北時間 09/12/15/19 點（UTC 01/04/07/11）重建，讓排程文章上線。
    # 不用第 0 分（GitHub 整點排程常延遲或被丟掉），每個時段跑 :02、:07、:13 三次，互為備援。
    - cron: '2,7,13 1,4,7,11 * * *'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: withastro/action@v6
        with:
          node-version: 22
        env:
          PUBLIC_GA_ID: ${{ vars.PUBLIC_GA_ID }}
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
