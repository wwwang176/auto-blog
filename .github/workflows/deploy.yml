name: Deploy to GitHub Pages
on:
  push:
    branches: [main]
  schedule:
    # 台北時間 09:00 / 12:00 / 15:00 / 19:00（UTC 01/04/07/11）重建，讓排程文章上線
    - cron: '0 1,4,7,11 * * *'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: withastro/action@v3
        env:
          PUBLIC_GA_ID: ${{ vars.PUBLIC_GA_ID }}
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
